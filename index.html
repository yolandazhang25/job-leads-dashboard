<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job Leads Dashboard</title>
  <style>
    :root {
      --bg: #f5efe5;
      --panel: rgba(255,255,255,0.82);
      --panel-strong: #fffdf9;
      --ink: #1f2937;
      --muted: #5f6b7a;
      --line: rgba(84, 61, 34, 0.12);
      --accent: #0f766e;
      --accent-soft: rgba(15,118,110,0.12);
      --warm: #b45309;
      --warm-soft: rgba(180,83,9,0.12);
      --high: #166534;
      --mid: #9a6700;
      --low: #b42318;
      --shadow: 0 18px 40px rgba(67, 47, 24, 0.12);
      --radius: 20px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "SF Pro Display", "PingFang SC", "Segoe UI", "Helvetica Neue", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(15,118,110,0.14), transparent 30%),
        radial-gradient(circle at top right, rgba(180,83,9,0.12), transparent 26%),
        linear-gradient(180deg, #f8f2e8 0%, #efe6d7 100%);
      min-height: 100vh;
    }

    .shell {
      width: min(1400px, calc(100vw - 32px));
      margin: 24px auto 40px;
      display: grid;
      grid-template-columns: 330px minmax(0, 1fr);
      gap: 20px;
    }

    .panel {
      background: var(--panel);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.5);
      box-shadow: var(--shadow);
      border-radius: var(--radius);
    }

    .sidebar {
      padding: 22px;
      position: sticky;
      top: 20px;
      height: fit-content;
    }

    .title {
      margin: 0 0 10px;
      font-size: 28px;
      line-height: 1.1;
      letter-spacing: -0.03em;
    }

    .subtitle {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 18px;
    }

    .stack {
      display: grid;
      gap: 12px;
    }

    .summary-card {
      padding: 14px 16px;
      border-radius: 16px;
      background: var(--panel-strong);
      border: 1px solid var(--line);
    }

    .summary-card strong {
      display: block;
      font-size: 22px;
      margin-bottom: 4px;
    }

    .label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      color: var(--muted);
    }

    .control,
    .search {
      width: 100%;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.9);
      color: var(--ink);
      border-radius: 12px;
      padding: 11px 12px;
      font-size: 14px;
    }

    .note {
      padding: 14px 16px;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(15,118,110,0.08), rgba(180,83,9,0.08));
      font-size: 13px;
      line-height: 1.6;
      color: #374151;
      border: 1px solid rgba(15,118,110,0.12);
    }

    .main {
      padding: 22px;
    }

    .hero {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
      margin-bottom: 18px;
    }

    .hero h2 {
      margin: 0;
      font-size: 30px;
      letter-spacing: -0.03em;
    }

    .hero p {
      margin: 8px 0 0;
      color: var(--muted);
      max-width: 760px;
      line-height: 1.6;
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1.4fr repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .results-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      color: var(--muted);
      font-size: 14px;
    }

    .grid {
      display: grid;
      gap: 16px;
    }

    .job-card {
      background: var(--panel-strong);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      display: grid;
      gap: 14px;
    }

    .job-top {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: flex-start;
    }

    .job-title {
      margin: 0;
      font-size: 22px;
      line-height: 1.25;
    }

    .job-company {
      margin-top: 6px;
      color: var(--muted);
      font-size: 15px;
    }

    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      padding: 7px 11px;
      font-size: 12px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.88);
    }

    .score {
      min-width: 88px;
      text-align: center;
      padding: 12px 14px;
      border-radius: 16px;
      font-weight: 700;
      border: 1px solid transparent;
    }

    .score.high { background: rgba(22,101,52,0.12); color: var(--high); border-color: rgba(22,101,52,0.16); }
    .score.mid { background: rgba(154,103,0,0.12); color: var(--mid); border-color: rgba(154,103,0,0.16); }
    .score.low { background: rgba(180,35,24,0.10); color: var(--low); border-color: rgba(180,35,24,0.14); }

    .meta-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px 16px;
    }

    .meta-item {
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(250,248,244,0.9);
      border: 1px solid rgba(84,61,34,0.08);
    }

    .meta-item .k {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .copy {
      line-height: 1.7;
      color: #344054;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .link-btn {
      text-decoration: none;
      color: var(--accent);
      background: rgba(15,118,110,0.08);
      border: 1px solid rgba(15,118,110,0.14);
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
    }

    .contacts {
      border-top: 1px solid var(--line);
      padding-top: 14px;
    }

    .contacts h4 {
      margin: 0 0 10px;
      font-size: 16px;
    }

    .contact-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .contact-card {
      padding: 12px;
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(255,255,255,0.96), rgba(252,248,240,0.92));
      border: 1px solid rgba(84,61,34,0.1);
    }

    .contact-tag {
      display: inline-block;
      padding: 5px 8px;
      border-radius: 999px;
      font-size: 11px;
      margin-bottom: 8px;
      background: var(--warm-soft);
      color: var(--warm);
    }

    .contact-title {
      font-size: 14px;
      font-weight: 700;
      line-height: 1.45;
      margin-bottom: 6px;
    }

    .contact-reason {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .empty {
      padding: 34px 18px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 18px;
      background: rgba(255,255,255,0.72);
    }

    @media (max-width: 1100px) {
      .shell { grid-template-columns: 1fr; }
      .sidebar { position: static; }
      .toolbar { grid-template-columns: 1fr 1fr; }
      .contact-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 740px) {
      .shell { width: min(100vw - 18px, 100%); margin: 10px auto 24px; }
      .main, .sidebar { padding: 16px; }
      .toolbar, .meta-grid { grid-template-columns: 1fr; }
      .job-top, .hero { display: block; }
      .score { margin-top: 12px; width: fit-content; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar panel">
      <h1 class="title">职位夜报面板</h1>
      <div class="subtitle">把 `Job_Leads_By_Date.md` 里的结果变成更快可读的网页。默认按匹配度从高到低排序，方便你先看最值得投入的岗位。</div>

      <div class="stack" id="summary"></div>

      <div class="stack" style="margin-top: 16px;">
        <div>
          <label class="label" for="sectionFilter">查看批次</label>
          <select id="sectionFilter" class="control"></select>
        </div>
        <div>
          <label class="label" for="laneFilter">岗位赛道</label>
          <select id="laneFilter" class="control"></select>
        </div>
        <div>
          <label class="label" for="minScore">最低匹配度</label>
          <select id="minScore" class="control">
            <option value="0">全部</option>
            <option value="8">8.0 以上</option>
            <option value="7">7.0 以上</option>
            <option value="6">6.0 以上</option>
          </select>
        </div>
      </div>

      <div class="note" style="margin-top: 16px;">
        “推荐联系对象”目前是联系方向，不是编造的人名。页面会优先给你 3 个值得白天去 LinkedIn 核实名字的切入口，这样既实用，也不会污染数据。
      </div>
    </aside>

    <main class="main panel">
      <div class="hero">
        <div>
          <h2>快速阅读版 Job Leads</h2>
          <p id="heroText"></p>
        </div>
      </div>

      <div class="toolbar">
        <input id="searchBox" class="search" type="search" placeholder="搜索公司、岗位、赛道、地点、关键词">
        <select id="sortBy" class="control">
          <option value="score_desc">按匹配度从高到低</option>
          <option value="score_asc">按匹配度从低到高</option>
          <option value="company_asc">按公司名称 A-Z</option>
          <option value="posted_desc">按发布日期文本</option>
        </select>
        <select id="sourceType" class="control">
          <option value="all">全部来源格式</option>
          <option value="detailed">详细夜报</option>
          <option value="table">旧版表格</option>
        </select>
        <select id="contactNeed" class="control">
          <option value="all">联系人状态：全部</option>
          <option value="yes">只看需要联系研究</option>
          <option value="no">只看无需联系研究</option>
        </select>
      </div>

      <div class="results-meta">
        <div id="resultCount"></div>
        <div id="generatedAt"></div>
      </div>

      <div id="results" class="grid"></div>
    </main>
  </div>

      const query = els.searchBox.value.trim().toLowerCase();
      const sortBy = els.sortBy.value;
      const sourceType = els.sourceType.value;
      const contactNeed = els.contactNeed.value;

      let entries = allEntries.filter(entry => {
        if (sectionValue !== "all" && entry.section_title !== sectionValue) return false;
        if (laneValue !== "all" && entry.lane !== laneValue) return false;
        if (entry.match_score_value < minScore) return false;
        if (sourceType !== "all" && entry.source_type !== sourceType) return false;
        if (contactNeed === "yes" && String(entry.contact_research_needed).toLowerCase() !== "yes") return false;
        if (contactNeed === "no" && String(entry.contact_research_needed).toLowerCase() === "yes") return false;
        if (query && !collectSearchBlob(entry).includes(query)) return false;
        return true;
      });

      entries = sortEntries(entries, sortBy);
      els.resultCount.textContent = `当前显示 ${entries.length} / ${allEntries.length} 个岗位`;
      renderCards(entries);
    }

    seedFilters();
    renderSummary();
    refresh();

    Object.values(els).forEach(el => {
      if (el instanceof HTMLInputElement || el instanceof HTMLSelectElement) {
        el.addEventListener("input", refresh);
        el.addEventListener("change", refresh);
      }
    });
  </script>
</body>
</html>
