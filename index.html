<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job Leads Dashboard</title>
  <style>
    :root {
      --bg: #fff7fb;
      --panel: rgba(255,255,255,0.82);
      --panel-strong: rgba(255,255,255,0.95);
      --ink: #2f2b45;
      --muted: #726b86;
      --line: rgba(125, 108, 144, 0.14);
      --accent: #b2568c;
      --accent-2: #f28fa8;
      --accent-3: #ffd6a5;
      --accent-4: #a38bff;
      --accent-soft: rgba(178,86,140,0.12);
      --warm: #d27a5d;
      --warm-soft: rgba(242,143,168,0.16);
      --high: #2f8f70;
      --mid: #b98538;
      --low: #d95f7a;
      --shadow: 0 26px 60px rgba(139, 110, 146, 0.16);
      --shadow-soft: 0 14px 30px rgba(120, 96, 132, 0.10);
      --radius: 24px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Avenir Next", "PingFang SC", "SF Pro Display", "Segoe UI", "Helvetica Neue", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 0% 0%, rgba(163,139,255,0.18), transparent 28%),
        radial-gradient(circle at 100% 0%, rgba(242,143,168,0.22), transparent 26%),
        radial-gradient(circle at 18% 78%, rgba(255,214,165,0.20), transparent 24%),
        radial-gradient(circle at 88% 76%, rgba(214,173,255,0.18), transparent 22%),
        linear-gradient(180deg, #fffafd 0%, #fff3f7 42%, #fff0e7 100%);
      min-height: 100vh;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: auto;
      z-index: 0;
      pointer-events: none;
      filter: blur(18px);
      opacity: 0.75;
    }

    body::before {
      width: 280px;
      height: 280px;
      top: 84px;
      right: 5vw;
      border-radius: 46% 54% 57% 43%;
      background: linear-gradient(135deg, rgba(163,139,255,0.18), rgba(242,143,168,0.18));
    }

    body::after {
      width: 240px;
      height: 240px;
      bottom: 40px;
      left: 3vw;
      border-radius: 59% 41% 48% 52%;
      background: linear-gradient(135deg, rgba(255,214,165,0.18), rgba(214,173,255,0.16));
    }

    .shell {
      width: min(1400px, calc(100vw - 32px));
      margin: 24px auto 40px;
      display: grid;
      grid-template-columns: 330px minmax(0, 1fr);
      gap: 20px;
      position: relative;
      z-index: 1;
    }

    .panel {
      background: var(--panel);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.62);
      box-shadow: var(--shadow);
      border-radius: var(--radius);
    }

    .sidebar {
      padding: 22px;
      position: sticky;
      top: 20px;
      height: fit-content;
      overflow: hidden;
    }

    .sidebar::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 130px;
      background:
        linear-gradient(135deg, rgba(214,173,255,0.18), rgba(242,143,168,0.16) 56%, rgba(255,214,165,0.14));
      border-radius: 24px 24px 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    .sidebar > * {
      position: relative;
      z-index: 1;
    }

    .title {
      margin: 6px 0 10px;
      font-size: 30px;
      line-height: 1.1;
      letter-spacing: -0.03em;
      font-family: "Georgia", "Times New Roman", "Songti SC", serif;
      font-weight: 700;
      color: #6f3f67;
    }

    .subtitle {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 18px;
    }

    .stack {
      display: grid;
      gap: 12px;
    }

    .summary-card {
      padding: 14px 16px;
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(255,255,255,0.97), rgba(255,245,249,0.92));
      border: 1px solid rgba(214,173,255,0.16);
      box-shadow: var(--shadow-soft);
      position: relative;
      overflow: hidden;
    }

    .summary-card::after {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      width: 64px;
      height: 64px;
      border-radius: 0 0 0 100%;
      background: linear-gradient(135deg, rgba(214,173,255,0.18), rgba(242,143,168,0.16));
    }

    .summary-card strong {
      display: block;
      font-size: 24px;
      margin-bottom: 4px;
      color: #7b416e;
    }

    .label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      color: var(--muted);
    }

    .control,
    .search {
      width: 100%;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.92);
      color: var(--ink);
      border-radius: 14px;
      padding: 11px 12px;
      font-size: 14px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.6);
    }

    .control:focus,
    .search:focus {
      outline: none;
      border-color: rgba(214,173,255,0.34);
      box-shadow: 0 0 0 4px rgba(214,173,255,0.18);
    }

    .note {
      padding: 14px 16px;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(255,234,241,0.92), rgba(250,241,255,0.88), rgba(255,244,230,0.90));
      font-size: 13px;
      line-height: 1.6;
      color: #6a5b73;
      border: 1px solid rgba(214,173,255,0.18);
    }

    .main {
      padding: 22px;
    }

    .hero {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
      margin-bottom: 18px;
      padding: 22px 24px;
      border-radius: 24px;
      background:
        linear-gradient(135deg, rgba(255,255,255,0.74), rgba(255,255,255,0.58)),
        linear-gradient(120deg, rgba(214,173,255,0.18), rgba(242,143,168,0.16) 45%, rgba(255,214,165,0.18));
      border: 1px solid rgba(255,255,255,0.64);
      box-shadow: var(--shadow-soft);
    }

    .hero h2 {
      margin: 0;
      font-size: 34px;
      letter-spacing: -0.03em;
      font-family: "Georgia", "Times New Roman", "Songti SC", serif;
      color: #6a3f66;
    }

    .hero p {
      margin: 8px 0 0;
      color: var(--muted);
      max-width: 760px;
      line-height: 1.6;
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1.4fr repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
      padding: 14px;
      border-radius: 20px;
      background: rgba(255,255,255,0.55);
      border: 1px solid rgba(255,255,255,0.55);
    }

    .results-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      color: var(--muted);
      font-size: 14px;
    }

    .grid {
      display: grid;
      gap: 16px;
    }

    .job-card {
      background:
        linear-gradient(180deg, rgba(255,255,255,0.97), rgba(255,248,240,0.96));
      border: 1px solid rgba(214,173,255,0.14);
      border-radius: 22px;
      padding: 20px;
      display: grid;
      gap: 14px;
      box-shadow: var(--shadow-soft);
      transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
      position: relative;
      overflow: hidden;
    }

    .job-card::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 6px;
      background: linear-gradient(180deg, var(--accent), var(--accent-4), var(--accent-2));
      opacity: 0.95;
    }

    .job-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 24px 48px rgba(69, 65, 111, 0.14);
      border-color: rgba(214,173,255,0.20);
    }

    .job-top {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: flex-start;
    }

    .job-title {
      margin: 0;
      font-size: 24px;
      line-height: 1.25;
    }

    .job-company {
      margin-top: 6px;
      color: var(--muted);
      font-size: 15px;
    }

    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      padding: 7px 11px;
      font-size: 12px;
      border: 1px solid rgba(214,173,255,0.14);
      background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(251,242,250,0.92));
    }

    .score {
      min-width: 88px;
      text-align: center;
      padding: 12px 14px;
      border-radius: 18px;
      font-weight: 700;
      border: 1px solid transparent;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.5);
    }

    .score.high { background: linear-gradient(135deg, rgba(47,143,112,0.16), rgba(183,240,217,0.16)); color: var(--high); border-color: rgba(47,143,112,0.16); }
    .score.mid { background: linear-gradient(135deg, rgba(255,214,165,0.26), rgba(242,143,168,0.14)); color: var(--mid); border-color: rgba(242,143,168,0.16); }
    .score.low { background: linear-gradient(135deg, rgba(242,143,168,0.18), rgba(214,173,255,0.16)); color: var(--low); border-color: rgba(217,95,122,0.16); }

    .meta-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px 16px;
    }

    .meta-item {
      padding: 12px 13px;
      border-radius: 16px;
      background: linear-gradient(180deg, rgba(255,250,252,0.96), rgba(249,246,255,0.94));
      border: 1px solid rgba(214,173,255,0.12);
    }

    .meta-item .k {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .copy {
      line-height: 1.7;
      color: #344054;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      position: relative;
      z-index: 5;
    }

    .link-btn {
      text-decoration: none;
      color: #9a4d7a;
      background: linear-gradient(135deg, rgba(255,238,244,0.96), rgba(245,238,255,0.90));
      border: 1px solid rgba(214,173,255,0.20);
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      transition: transform 140ms ease, box-shadow 140ms ease, border-color 140ms ease;
      position: relative;
      z-index: 6;
      pointer-events: auto;
      cursor: pointer;
    }

    .link-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 18px rgba(170, 124, 157, 0.12);
      border-color: rgba(214,173,255,0.28);
    }

    .contacts {
      border-top: 1px solid var(--line);
      padding-top: 14px;
    }

    .contacts h4 {
      margin: 0 0 10px;
      font-size: 16px;
    }

    .contact-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .contact-card {
      padding: 14px;
      border-radius: 18px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.98), rgba(255,248,243,0.96)),
        linear-gradient(135deg, rgba(124,108,255,0.06), rgba(255,122,89,0.06));
      border: 1px solid rgba(214,173,255,0.16);
      box-shadow: 0 10px 18px rgba(66, 76, 116, 0.06);
    }

    .contact-tag {
      display: inline-block;
      padding: 5px 8px;
      border-radius: 999px;
      font-size: 11px;
      margin-bottom: 8px;
      background: linear-gradient(135deg, rgba(255,232,190,0.42), rgba(242,143,168,0.20));
      color: #b05a74;
    }

    .contact-title {
      font-size: 14px;
      font-weight: 700;
      line-height: 1.45;
      margin-bottom: 6px;
    }

    .contact-reason {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .contact-source {
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted);
    }

    .contact-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
      position: relative;
      z-index: 5;
    }

    .contact-link,
    .copy-btn {
      appearance: none;
      border: 1px solid rgba(214,173,255,0.20);
      background: linear-gradient(135deg, rgba(255,238,244,0.95), rgba(242,238,255,0.90));
      color: var(--accent);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: transform 140ms ease, box-shadow 140ms ease;
      position: relative;
      z-index: 6;
      pointer-events: auto;
    }

    .contact-link:hover,
    .copy-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 18px rgba(170, 124, 157, 0.10);
    }

    .copy-btn {
      background: linear-gradient(135deg, rgba(255,255,255,0.98), rgba(255,239,233,0.84));
      color: var(--ink);
      border-color: rgba(242,143,168,0.18);
    }

    .greeting-box {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 12px;
      background: linear-gradient(180deg, rgba(255,250,252,0.97), rgba(247,244,255,0.95));
      border: 1px solid rgba(214,173,255,0.12);
    }

    .greeting-label {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .greeting-text {
      font-size: 12px;
      line-height: 1.65;
      color: #344054;
      word-break: break-word;
    }

    .empty {
      padding: 34px 18px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 18px;
      background: rgba(255,255,255,0.72);
    }

    @media (max-width: 1100px) {
      .shell { grid-template-columns: 1fr; }
      .sidebar { position: static; }
      .toolbar { grid-template-columns: 1fr 1fr; }
      .contact-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 740px) {
      .shell { width: min(100vw - 18px, 100%); margin: 10px auto 24px; }
      .main, .sidebar { padding: 16px; }
      .toolbar, .meta-grid { grid-template-columns: 1fr; }
      .job-top, .hero { display: block; }
      .score { margin-top: 12px; width: fit-content; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar panel">
      <h1 class="title">职位夜报面板</h1>
      <div class="subtitle">把 `Job_Leads_By_Date.md` 里的结果变成更快可读的网页。默认按匹配度从高到低排序，方便你先看最值得投入的岗位。</div>

      <div class="stack" id="summary"></div>

      <div class="stack" style="margin-top: 16px;">
        <div>
          <label class="label" for="sectionFilter">查看批次</label>
          <select id="sectionFilter" class="control"></select>
        </div>
        <div>
          <label class="label" for="laneFilter">岗位赛道</label>
          <select id="laneFilter" class="control"></select>
        </div>
        <div>
          <label class="label" for="minScore">最低匹配度</label>
          <select id="minScore" class="control">
            <option value="0">全部</option>
            <option value="8">8.0 以上</option>
            <option value="7">7.0 以上</option>
            <option value="6">6.0 以上</option>
          </select>
        </div>
      </div>

      <div class="note" style="margin-top: 16px;">
        页面现在只展示实名可核实联系人；没有核实名字的岗位会明确显示“待补实名联系人”。默认会隐藏 `Closed` 岗位，避免已停招职位继续占据主列表。
      </div>
    </aside>

    <main class="main panel">
      <div class="hero">
        <div>
          <h2>快速阅读版 Job Leads</h2>
          <p id="heroText"></p>
        </div>
      </div>

      <div class="toolbar">
        <input id="searchBox" class="search" type="search" placeholder="搜索公司、岗位、赛道、地点、关键词">
        <select id="sortBy" class="control">
          <option value="score_desc">按匹配度从高到低</option>
          <option value="score_asc">按匹配度从低到高</option>
          <option value="company_asc">按公司名称 A-Z</option>
          <option value="posted_desc">按发布日期文本</option>
        </select>
        <select id="sourceType" class="control">
          <option value="all">全部来源格式</option>
          <option value="detailed">详细夜报</option>
          <option value="table">旧版表格</option>
        </select>
        <select id="contactNeed" class="control">
          <option value="all">联系人状态：全部</option>
          <option value="yes">只看需要联系研究</option>
          <option value="no">只看无需联系研究</option>
        </select>
        <select id="statusFilter" class="control">
          <option value="active">默认隐藏 Closed</option>
          <option value="all">显示全部状态</option>
          <option value="closed">只看 Closed</option>
        </select>
      </div>

      <div class="results-meta">
        <div id="resultCount"></div>
        <div id="generatedAt"></div>
      </div>

      <div id="results" class="grid"></div>
    </main>
  </div>

                <div class="job-company">${esc(entry.company)} · ${esc(entry.lane)}</div>
              </div>
              <div class="score ${scoreClass(entry.match_score_value)}">${esc(entry.match_score_display || entry.match_score || "N/A")}</div>
            </div>

            <div class="pill-row">
              ${makePill(entry.status)}
              ${makePill(entry.fit_tier ? `Fit: ${entry.fit_tier}` : "")}
              ${makePill(entry.section_title)}
              ${makePill(entry.location)}
              ${makePill(entry.posted)}
              ${makePill(entry.easy_apply ? `Easy Apply: ${entry.easy_apply}` : "")}
            </div>

            <div class="meta-grid">
              <div class="meta-item"><span class="k">JD 摘要</span>${esc(entry.jd_summary || entry.next_action || "暂无")}</div>
              <div class="meta-item"><span class="k">简历切入点</span>${esc(entry.resume_angle || entry.next_action || "暂无")}</div>
              ${entry.gaps_risk ? `<div class="meta-item"><span class="k">缺口 / 风险</span>${esc(entry.gaps_risk)}</div>` : ""}
              <div class="meta-item"><span class="k">申请路径</span>${esc(entry.application_path || "暂无")}</div>
              <div class="meta-item"><span class="k">LinkedIn 信号</span>${esc(entry.linkedin_signals || "暂无")}</div>
            </div>

            <div class="links">
              ${linkButton("LinkedIn 职位页", entry.linkedin_link)}
              ${linkButton("官方申请页", entry.official_link)}
            </div>

            <div class="contacts">
              <h4>${entry.contacts_verified ? "已核实联系人" : "待补实名联系人"}</h4>
              ${contactBlock}
            </div>
          </article>
        `;
      }).join("");

      els.results.querySelectorAll(".copy-btn").forEach(button => {
        button.addEventListener("click", () => copyGreeting(button.dataset.greeting || "", button));
      });
      els.results.querySelectorAll(".open-link-btn").forEach(button => {
        button.addEventListener("click", () => {
          const href = button.dataset.href || "";
          if (!href) return;
          try {
            window.open(href, "_blank", "noopener,noreferrer");
          } catch (_err) {
            window.location.href = href;
          }
        });
      });
      els.results.querySelectorAll(".contact-link").forEach(link => {
        link.addEventListener("click", event => {
          const href = link.getAttribute("href") || "";
          if (!href || href === "#") return;
          event.preventDefault();
          try {
            window.open(href, "_blank", "noopener,noreferrer");
          } catch (_err) {
            window.location.href = href;
          }
        });
      });
    }

    function refresh() {
      const sectionValue = els.sectionFilter.value;
      const laneValue = els.laneFilter.value;
      const minScore = Number(els.minScore.value || 0);
      const query = els.searchBox.value.trim().toLowerCase();
      const sortBy = els.sortBy.value;
      const sourceType = els.sourceType.value;
      const contactNeed = els.contactNeed.value;
      const statusFilter = els.statusFilter.value;

      let entries = allEntries.filter(entry => {
        if (sectionValue !== "all" && entry.section_title !== sectionValue) return false;
        if (!matchesLaneFilter(entry, laneValue)) return false;
        if (entry.match_score_value < minScore) return false;
        if (sourceType !== "all" && entry.source_type !== sourceType) return false;
        if (contactNeed === "yes" && String(entry.contact_research_needed).toLowerCase() !== "yes") return false;
        if (contactNeed === "no" && String(entry.contact_research_needed).toLowerCase() === "yes") return false;
        if (statusFilter === "active" && String(entry.status).includes("Closed")) return false;
        if (statusFilter === "closed" && !String(entry.status).includes("Closed")) return false;
        if (query && !collectSearchBlob(entry).includes(query)) return false;
        return true;
      });

      entries = sortEntries(entries, sortBy);
      els.resultCount.textContent = `当前显示 ${entries.length} / ${allEntries.length} 个岗位`;
      renderCards(entries);
    }

    seedFilters();
    renderSummary();
    refresh();

    Object.values(els).forEach(el => {
      if (el instanceof HTMLInputElement || el instanceof HTMLSelectElement) {
        el.addEventListener("input", refresh);
        el.addEventListener("change", refresh);
      }
    });
  </script>
</body>
</html>
